[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotics-extraction"
version = "0.1.0"
description = "Deterministic, rule-based extraction of robotics engineering facts from drawings, datasheets, schematics and I/O lists - no LLM. Connects to robotics-sme only through a versioned JSON contract (see schema.py)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "ezdxf>=1.3",
    "pdfplumber>=0.11",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
